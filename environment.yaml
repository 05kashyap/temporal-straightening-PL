# Conda environment for temporal-straightening-PL (laptop, user kashyap).
#
# Rebuilt from the original `conda env export` snapshot, which pinned transitive
# conda packages by exact build string (e.g. libgcc-ng=13.2.0=h77fa898_7). Those
# 2024-era pins no longer resolve cleanly under conda>=24 and left the `ts` env
# with python only (no torch/mujoco). This version keeps python 3.9 and the exact
# versions this repo imports, and adds the native toolchain mujoco_py needs to
# compile its cymj extension on first import (gcc via c-compiler/cxx-compiler,
# rpath patching via patchelf; cmake/make for any sdist-only fallbacks).
name: ts
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - numpy=1.26.4
  - pillow=10.3.0
  - ffmpeg>=4.3
  - git
  - cmake
  - patchelf
  - make
  - c-compiler
  - cxx-compiler
  # mujoco_py's GPU (EGL) cymj build needs X11 + GL headers; conda's glew is
  # self-contained for GL (site-packages/mujoco_py/builder.py is patched to add
  # -DGLEW_NO_GLU so no system GL/gl.h is required).
  - xorg-xorgproto
  - xorg-libx11
  - glew
  - pip:
      # --- deep learning / training core ---
      - torch==2.3.0
      - torchvision==0.18.0
      - accelerate==0.26.1
      - einops==0.4.1
      - omegaconf==2.3.0
      - hydra-core==1.2.0
      - hydra-submitit-launcher==1.2.0
      - wandb==0.13.1
      - submitit==1.5.1
      # --- data loading ---
      - decord==0.6.0
      # --- environments: point_maze (gym+mujoco_py+d4rl), pusht/wall (pymunk/opencv) ---
      # mujoco + dm-control are d4rl's transitive deps; pinned to the versions that
      # ship cp39 wheels (unpinned, pip tries to build the latest mujoco sdist,
      # which needs MUJOCO_PATH and fails on python 3.9).
      - mujoco==3.2.7
      - dm-control==1.0.27
      - gym==0.23.1
      - mujoco-py==2.1.2.14
      - glfw==2.7.0
      - cython==0.29.37
      - cffi==1.16.0
      - fasteners==0.19
      - d4rl==1.1
      - pymunk==6.8.0
      - pygame==2.5.2
      - pybullet==3.2.7
      - shapely==2.0.3
      - trimesh==4.4.0
      # --- vision / media ---
      - opencv-python==4.6.0.66
      - scikit-image==0.19.3
      - imageio==2.34.1
      - imageio-ffmpeg==0.4.9
      - moviepy==1.0.3
      - matplotlib==3.5.3
      # --- numeric / misc ---
      - scipy==1.13.1
      - scikit-learn==1.5.0
      - tqdm==4.66.4
      - requests==2.32.3
      - pyyaml==6.0.1
      - pytest==8.2.1
